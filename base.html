<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}NEXUS AI{% endblock %}</title><style>
:root{color-scheme:dark;--bg:#080b14;--panel:#111829;--line:#2b3650;--text:#eef3ff;--muted:#9ba8c4;--accent:#8b7cff;--teal:#40d9d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#191e3c,#080b14 65%);color:var(--text);font:15px/1.5 system-ui,sans-serif;min-height:100vh}a{color:var(--teal);text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;padding:18px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid #ffffff15}.brand{font-weight:900;letter-spacing:.16em;color:var(--text)}.brand span{color:var(--teal)}.nav{display:flex;gap:14px;flex-wrap:wrap}.wrap{width:min(1100px,calc(100% - 30px));margin:32px auto}.card{background:#111829eF;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px #0003}.auth{max-width:440px;margin:7vh auto}.eyebrow{font-size:.75rem;color:var(--teal);letter-spacing:.16em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.12;margin:.5rem 0 1rem}h2{margin-top:0}.muted,.hint{color:var(--muted)}.hint{font-size:.82rem}label{display:block;margin:16px 0 7px}input{width:100%;padding:13px;background:#090e1a;border:1px solid #303b55;border-radius:11px;color:var(--text);font:inherit}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(100deg,#7968ff,#5a8dff);color:white;font-weight:700;cursor:pointer;font:inherit;text-align:center}.secondary{background:#222d43}.danger{background:#76283b}.full{width:100%;margin-top:18px}.error{background:#421c2a;border:1px solid #81374b;padding:10px;border-radius:10px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}.pill{border:1px solid #34415e;border-radius:99px;padding:4px 10px;font-size:.8rem}.stat{background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.stat strong{display:block;font-size:1.4rem}.messages{display:flex;flex-direction:column;gap:12px}.bubble{padding:13px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:95%}.user{align-self:flex-end;background:#302a61}.ai{align-self:flex-start;background:#0b1323;border:1px solid var(--line)}.composer{display:flex;gap:9px;margin-top:20px}.composer input{flex:1}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:5px;flex-wrap:wrap}.small{padding:7px 9px;font-size:.82rem}@media(max-width:760px){.layout{grid-template-columns:1fr}.composer{flex-direction:column}.card{padding:17px}.top{padding:15px}}
</style></head><body><header class="top"><a class="brand" href="{{ url_for('index') }}">NEXUS<span>AI</span></a><nav class="nav">{% if session.get('username') %}<a href="{{ url_for('chat') }}">Chat</a>{% if current_user and current_user.get('admin') %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}<a href="{{ url_for('logout') }}">Log out</a>{% else %}<a href="{{ url_for('login') }}">Log in</a><a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header>{% block body %}{% endblock %}</body></html>
